name: Build ServerWatch

on:
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-agent:
    name: Build Windows agent
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ServerWatch.slnx -r win-x64

      - name: Publish self-contained Windows agent
        run: dotnet publish src/ServerWatch.Agent/ServerWatch.Agent.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/ServerWatch.Agent

      - name: Include agent configuration example
        shell: pwsh
        run: Copy-Item src/ServerWatch.Agent/.env.example artifacts/ServerWatch.Agent/.env.example

      - name: Upload agent package
        uses: actions/upload-artifact@v6
        with:
          name: ServerWatch-Agent-win-x64
          path: artifacts/ServerWatch.Agent/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      - name: Package agent for the GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $agentFiles = Get-ChildItem -Force artifacts/ServerWatch.Agent | Select-Object -ExpandProperty FullName
          Compress-Archive -Path $agentFiles -DestinationPath artifacts/ServerWatch-Agent-win-x64.zip -CompressionLevel Optimal

      - name: Attach agent ZIP to the GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/ServerWatch-Agent-win-x64.zip --clobber

  build-master:
    name: Build unified container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Docker Compose configuration
        run: |
          cp master/.env.docker.example master/.env
          docker compose config --quiet
          rm master/.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare unified image metadata
        id: image-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nerdscorp/serverwatch
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.ref == 'refs/heads/main' }}

      - name: Build and publish unified image
        uses: docker/build-push-action@v7
        with:
          context: ./master
          file: ./master/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image-meta.outputs.tags }}
          labels: ${{ steps.image-meta.outputs.labels }}
          cache-from: type=gha,scope=master
          cache-to: type=gha,mode=max,scope=master
