name: Build ServerWatch

on:
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-agent:
    name: Build Windows agent
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ServerWatch.slnx -r win-x64

      - name: Publish self-contained Windows agent
        run: dotnet publish src/ServerWatch.Agent/ServerWatch.Agent.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/ServerWatch.Agent

      - name: Include agent configuration example
        shell: pwsh
        run: Copy-Item src/ServerWatch.Agent/.env.example artifacts/ServerWatch.Agent/.env.example

      - name: Upload agent package
        uses: actions/upload-artifact@v6
        with:
          name: ServerWatch-Agent-win-x64
          path: artifacts/ServerWatch.Agent/
          if-no-files-found: error
          retention-days: 14

  build-master:
    name: Build master containers
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Docker Compose configuration
        run: |
          cp master/.env.docker.example master/.env
          docker compose config --quiet
          rm master/.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build PHP master image
        uses: docker/build-push-action@v7
        with:
          context: ./master
          file: ./master/Dockerfile
          push: false
          tags: serverwatch/master:${{ github.sha }}
          cache-from: type=gha,scope=master
          cache-to: type=gha,mode=max,scope=master

      - name: Build Nginx web image
        uses: docker/build-push-action@v7
        with:
          context: ./master
          file: ./master/Dockerfile.nginx
          push: false
          tags: serverwatch/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
