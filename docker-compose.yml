name: serverwatch

services:
  master:
    image: ghcr.io/nerdscorp/serverwatch:latest
    env_file:
      - ./master/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/serverwatch/database.sqlite
      LOG_CHANNEL: stderr
    volumes:
      - serverwatch-data:/var/lib/serverwatch
      - serverwatch-storage:/var/www/html/storage
      - serverwatch-cache:/var/www/html/bootstrap/cache
    ports:
      - "${SERVERWATCH_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  serverwatch-data:
    name: serverwatch-data
  serverwatch-storage:
    name: serverwatch-storage
  serverwatch-cache:
    name: serverwatch-cache
